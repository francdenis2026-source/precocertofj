<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="PreçoCerto — Feijó · Acre">
  <title>PreçoCerto — Feijó · Acre</title>
  <style>
    .p { fill: currentColor; }
    .c { fill: #e2a520; }
    .sub { fill: #94a3b8; letter-spacing: 6px; }
    .rule { stroke: #e2a520; stroke-width: 4; stroke-linecap: round; }
    text { font-family: 'Sora','Inter',system-ui,sans-serif; font-weight: 700; }
  </style>
  <!-- Marca (tag+check) -->
  <g transform="translate(0 8) scale(0.86)">
    <use href="#tag"/>
  </g>
  <defs>
    <symbol id="tag" viewBox="0 0 128 128">
      <path d="M63 20 C 55 8, 40 8, 40 22 C 40 30, 46 34, 52 34" fill="none" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M40 26 h48 a8 8 0 0 1 5.66 2.34 l22 22 a8 8 0 0 1 0 11.32 l-40 40 a8 8 0 0 1 -11.32 0 l-22-22 A8 8 0 0 1 40 74 Z" fill="#f2b829" stroke="#c98f1a" stroke-width="1.2"/>
      <circle cx="55" cy="41" r="6.5" fill="#0b1e3a"/>
      <circle cx="55" cy="41" r="2.4" fill="#f2b829"/>
      <path d="M55 74 l12 12 l24 -26" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <!-- Wordmark -->
  <text x="140" y="72" font-size="60"><tspan class="p">Preço</tspan><tspan class="c">Certo</tspan></text>
  <!-- Subtitle -->
  <line x1="140" y1="96" x2="168" y2="96" class="rule"/>
